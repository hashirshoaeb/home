<!DOCTYPE html>
<!-- Source for public/social-image.png (1200x630 link-preview card).
     Re-render with headless Chrome:
     chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=public/social-image.png scripts/social-image.html -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; }
      body {
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        text-align: center; color: #fff;
        font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: linear-gradient(136deg, #0A2347, #384967, #0071D9, #71439A, #D41E3D, #F2BE19);
      }
      h1 { font-size: 104px; font-weight: 300; margin: 0 0 28px; letter-spacing: -1px; }
      p { font-size: 34px; font-weight: 300; line-height: 1.4; max-width: 900px; margin: 0; }
      small { position: absolute; bottom: 44px; font-size: 24px; opacity: 0.85; }
    </style>
  </head>
  <body>
    <h1>Juan P. Romero</h1>
    <p>Unlocking the complexity of biology by harnessing computer science and cutting-edge algorithms</p>
    <small>jpromeror.github.io/website</small>

</html>
